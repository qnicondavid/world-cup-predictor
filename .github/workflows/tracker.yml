name: Daily prediction tracker

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily during the tournament
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

# Queue overlapping runs (cron + manual dispatch) instead of racing them.
# cancel-in-progress: false lets the first run finish and pushes serialize.
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Refresh match dataset
        run: |
          set -eu
          curl -fsSL --retry 3 --max-time 120 -o data/results.csv.new \
            https://raw.githubusercontent.com/martj42/international_results/master/results.csv

          new=data/results.csv.new
          cur=data/results.csv

          # (iii) new file must be non-trivial (guards against truncated/empty downloads)
          new_size=$(wc -c < "$new")
          if [ "$new_size" -lt 3000000 ]; then
            echo "ERROR: downloaded file is only $new_size bytes (< 3MB); refusing to overwrite" >&2
            rm -f "$new"
            exit 1
          fi

          if [ -f "$cur" ]; then
            # (i) header row must match the current file's header exactly
            new_header=$(head -n 1 "$new")
            cur_header=$(head -n 1 "$cur")
            if [ "$new_header" != "$cur_header" ]; then
              echo "ERROR: header changed" >&2
              echo "  current: $cur_header" >&2
              echo "  new:     $new_header" >&2
              rm -f "$new"
              exit 1
            fi

            # (ii) row count must be within ~2% of the current row count
            new_rows=$(wc -l < "$new")
            cur_rows=$(wc -l < "$cur")
            # tolerance = 2% of current (integer, floored); require at least 1
            tol=$(( cur_rows / 50 ))
            if [ "$tol" -lt 1 ]; then tol=1; fi
            diff=$(( new_rows - cur_rows ))
            if [ "$diff" -lt 0 ]; then diff=$(( -diff )); fi
            if [ "$diff" -gt "$tol" ]; then
              echo "ERROR: row count $new_rows differs from current $cur_rows by more than 2% (tol=$tol)" >&2
              rm -f "$new"
              exit 1
            fi
          else
            echo "No existing $cur (first run); accepting downloaded file after size check."
          fi

          mv "$new" "$cur"

      - name: Lock new predictions and score completed ones
        run: mvn -B -q compile exec:java -Dexec.args="--track"

      - name: Capture live bookmaker odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "No ODDS_API_KEY secret set; skipping odds capture."
            exit 0
          fi
          # Appends a timestamped 1X2 snapshot to data/odds_live.csv (the market probabilities
          # the model is scored against). Non-fatal: a bad API day must not break the tracker.
          python3 research/fetch_odds_live.py soccer_fifa_world_cup || echo "odds capture soft-failed; continuing"

      - name: Score model vs bookmaker on the live matches
        run: |
          # De-vigs the captured odds and writes docs/data/live_market.json: model vs market
          # multiclass Brier on every 2026 match with both a locked prediction and a price. Non-fatal.
          python3 research/live_vs_market.py || echo "live_vs_market soft-failed; continuing"

      - name: Append today's title odds to the trajectory history
        run: |
          python3 - <<'PY'
          import json, os
          tj = json.load(open('docs/data/tracker.json'))
          date = tj.get('updated')
          odds = {o['team']: round(o['title'], 1) for o in tj.get('titleOdds', [])}
          path = 'docs/data/odds_history.json'
          hist = json.load(open(path)) if os.path.exists(path) else []
          hist = [h for h in hist if h.get('date') != date]   # replace same-day re-runs
          hist.append({'date': date, 'odds': odds})
          hist.sort(key=lambda h: h['date'])
          open(path, 'w').write(json.dumps(hist, indent=0))
          print('trajectory history now spans', len(hist), 'day(s)')
          PY

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.csv predictions/predictions.csv README.md docs/data/tracker.json docs/data/odds_history.json \
            data/odds_live.csv docs/data/live_market.json
          git diff --cached --quiet || git commit -m "Tracker: lock predictions / update results $(date -u +%F)"
          # Self-heal lost races: retry the whole pull --rebase + push a few times. Both are in
          # the if-condition so a failed rebase does not trip `set -e`; abort any half-done rebase
          # between attempts so the next pull --rebase starts clean.
          n=0
          until [ "$n" -ge 3 ]; do
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push origin HEAD; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            n=$(( n + 1 ))
            echo "pull/push failed (attempt $n); refetching and retrying..." >&2
            sleep 3
          done
          echo "ERROR: git pull/push failed after 3 attempts" >&2
          exit 1
