<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">World Cup Predictor</title>
<desc id="desc">Logo banner on GitHub's dark canvas: a three-bar win/draw/loss mark, the wordmark World Cup Predictor, and two subtitle lines about parity with the closing line and the held-out results.</desc>
<rect width="1200" height="480" fill="#0d1117"/>
<rect x="555" y="58" width="26" height="118" fill="#E08A63"/>
<rect x="587" y="114" width="26" height="62" fill="#9C5A3C"/>
<rect x="619" y="92" width="26" height="84" fill="#E08A63"/>
<text x="600" y="316" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="-1.3" font-size="80" fill="#F2F0E9">World Cup Predictor</text>
<text x="600" y="374" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" fill="#8b949e">An honest model, at parity with the bookmaker&#8217;s closing line</text>
<text x="600" y="418" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#6e7681">49,000 matches since 1872<tspan fill="#E08A63">   &#183;   </tspan>Brier 0.5441 on 320 held out<tspan fill="#E08A63">   &#183;   </tspan>17 rejected, 3 shipped</text>
</svg>
